name: Bug report
description: Something is wrong or crashes
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands or Python script, and a small dataset if you can share one.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (release tag, or nightly date and commit)
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS, CPU and GPU
  - type: textarea
    id: log
    attributes:
      label: Log output
      render: text
