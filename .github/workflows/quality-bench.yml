name: Quality benchmark

# Weekly real-data quality benchmark on public datasets. Downloads imagery and the
# publisher's own reference products, runs the CLI pipeline at default settings, and
# records reference-free and reference-based metrics. Fails only on a regression against
# the previous run of the SAME dataset, never on an absolute value.
#
# The datasets are NOT committed. Each is fetched from its publisher at run time and
# verified against tools/bench/datasets.json (URL, SHA-256, byte count). Licences differ
# per dataset and are recorded in tools/bench/DATASETS.md; none are redistributed here.
#
# Accepting a regression (workflow_dispatch only)
# -----------------------------------------------
# A failed run never publishes a baseline, so a deliberate trade-off — one metric worse,
# the rest clearly better — would fail every later run against a baseline that can no
# longer be reached. The `accept_regression` dispatch input is the way out, and it is
# deliberately narrow:
#
#   * it holds the REASON, which must be non-empty printable text of <= 200 characters;
#   * it is honoured only on the DEFAULT branch, never on a feature branch, and never
#     for an experiment (empty `depth_params`);
#   * when honoured, the verdict is still computed and shown in the report — every
#     regressed metric with previous -> current — but the job does not fail on it, and
#     the run publishes its metrics as the new baseline;
#   * the reason, the dispatching actor, the run id and the accepted moves are written
#     into the published metrics JSON (and the report), so the baseline explains itself.
#
#   gh workflow run quality-bench.yml --ref main \
#     -f dataset=aerial-nadir -f accept_regression="why the trade-off is acceptable"
#
# The reason reaches tools/bench/accept_regression.py through an environment variable,
# never interpolated into a shell line, because a dispatch input is untrusted text.
# Scheduled runs have no input, so their behaviour is unchanged.

on:
  schedule:
    # Monday 04:17 UTC: off the top of the hour, so it does not queue behind the
    # nightly build that starts at 20:30 UTC and can still be running.
    - cron: "17 4 * * 1"
  # A change to the benchmark itself exercises it on the branch that changed it.
  # Two limits keep that affordable: it only fires for the bench's own files, and
  # it runs the primary dataset only. The schedule is what covers every dataset.
  push:
    paths:
      - ".github/workflows/quality-bench.yml"
      - "tools/bench/**"
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset to run (see tools/bench/datasets.json)"
        type: choice
        default: aerial-nadir
        options:
          - aerial-nadir
          - terrestrial-laser
          - all
      # Extra BuildDepthMaps keyword arguments, e.g. "cost_type=census". This exists
      # so a change to a depth-map parameter can be MEASURED on the same dataset as a
      # control run. It is strictly a reporting mode: the run is never published as
      # the regression baseline and never fails the gate, because a configuration
      # that is still being evaluated is not the default the gate defends.
      #
      # The value is validated by tools/bench/run_bench.py --depth-params and reaches
      # that script through an environment variable. It is never interpolated into a
      # shell line: a dispatch input is untrusted text, and `${{ }}` inside `run:`
      # would make it code.
      depth_params:
        description: 'Extra BuildDepthMaps key=value pairs, space separated (e.g. "cost_type=census")'
        type: string
        default: ""
      # Accept a regression BY HAND, so a deliberate trade-off (worse on one metric,
      # clearly better on the rest) can become the new baseline instead of failing
      # every later run against a baseline nobody can reach.
      #
      # Requires ALL of: a non-empty reason here, a run on the DEFAULT branch, and a
      # control run (no depth_params). A non-default branch, or an experiment, is
      # refused with an error rather than silently honoured — a feature branch must
      # never move the shared baseline. The reason is untrusted dispatch text: it
      # reaches the script through an environment variable, never interpolated into
      # a shell line, and tools/bench/accept_regression.py validates it (printable,
      # <= 200 chars).
      #
      # When honoured: the verdict is STILL computed and shown, naming every
      # regressed metric old -> new; the job does not fail on it; the run publishes
      # its metrics as the new baseline; and the reason, the actor and the accepted
      # moves are recorded in the metrics JSON and the report.
      accept_regression:
        description: 'Reason for accepting a regression (default branch only; e.g. "depth defaults: offset +0.1 m for +12% coverage")'
        type: string
        default: ""

permissions:
  contents: read
  # The baseline is an artifact from the last SUCCESSFUL run of this workflow, so
  # the bench job has to list runs and download their artifacts with `gh`. Without
  # `actions: read` those calls are refused and the regression gate can never fire.
  actions: read

concurrency:
  # The group is unchanged for scheduled and ordinary manual runs: an experiment is
  # suffixed so it does not cancel (or wait behind) the control run on the same
  # dataset, which is the one it is being compared with. The `||` chain evaluates
  # left to right, so with no depth_params the group is exactly what it was before.
  group: quality-bench-${{ github.event.inputs.dataset || 'scheduled' }}${{ github.event.inputs.depth_params && '-experiment' || '' }}
  cancel-in-progress: false

env:
  # The bench is CPU-only on purpose: a shared runner's software Vulkan device is
  # slower than the CPU lanes and would make the timings incomparable between runs.
  ALPHASHAPE_GPU: "0"
  # No performance assertions anywhere in this job: it measures, it does not gate
  # on speed. The regression gate is the metrics verdict.
  ALPHASHAPE_PERF_ASSERTS: "0"
  OMP_NUM_THREADS: "4"
  OMP_WAIT_POLICY: passive

jobs:
  # Resolve the dataset list once so the matrix and the cache key agree. A scheduled
  # run does every dataset; a manual run honours the input.
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      datasets: ${{ steps.plan.outputs.datasets }}
      cache-key: ${{ steps.plan.outputs.cache-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install the plan dependencies
        # The manifest commands need nothing, but the metrics tests below do, and
        # installing once here keeps the matrix and hash steps free of a separate
        # Python setup.
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Resolve datasets and cache key
        id: plan
        env:
          REQUESTED: ${{ github.event.inputs.dataset }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            # A push is the bench proving itself on the branch that changed it, not
            # a scheduled survey: one dataset is enough evidence and a fraction of
            # the runner time.
            names="aerial-nadir"
          elif [ -z "$REQUESTED" ] || [ "$REQUESTED" = "all" ]; then
            names=$(python3 tools/bench/run_bench.py --list-datasets | cut -f1)
          else
            names="$REQUESTED"
          fi
          echo "running: $(echo "$names" | tr '\n' ' ')"
          matrix=$(printf '%s\n' $names | python3 -c '
          import json, sys
          names = [line.strip() for line in sys.stdin if line.strip()]
          print(json.dumps({"dataset": names}))
          ')
          echo "datasets=$matrix" >> "$GITHUB_OUTPUT"
          # The cache key follows the manifest CONTENT so a corrected hash or a new
          # dataset invalidates the cached downloads instead of reusing a stale tree.
          key=$(python3 tools/bench/run_bench.py --manifest-hash)
          echo "cache-key=bench-data-$key" >> "$GITHUB_OUTPUT"

      - name: Metrics and report unit tests
        # Stdlib + numpy only, and they finish in well under a second, so a broken
        # metric is caught before the engine is built or a dataset is downloaded.
        run: python3 -m unittest discover -s tools/bench/tests -v

  build:
    name: Build CLI
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Only the CLI is built: no GUI, no Python bindings, no Vulkan. Reusing
      # build.yml would compile the GUI and the Python module for Windows and macOS
      # as well, which is an hour of runner time for a binary the bench never
      # touches. The configure flags below are the ones build.yml uses for Linux,
      # minus everything the bench does not need.
      # The Azure apt mirror is intermittently throttled to a crawl — it failed this
      # job outright on one run — so installs go through the shared action: mirror
      # rotation plus a .deb cache keyed on the package list.
      - name: Install build dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            build-essential cmake ninja-build ccache
            libeigen3-dev libceres-dev libproj-dev proj-data zlib1g-dev libjpeg-dev
            libpng-dev libtiff-dev
          attempt-timeout: "240"
          install-timeout: "420"

      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .ccache
          key: bench-ccache-${{ github.sha }}
          restore-keys: |
            bench-ccache-

      - name: Configure
        run: |
          cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DALPHASHAPE_BUILD_TESTS=OFF \
            -DALPHASHAPE_BUILD_PYTHON=OFF \
            -DALPHASHAPE_BUILD_GUI=OFF \
            -DALPHASHAPE_GPU=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build the CLI
        run: cmake --build build --target alphashape-cli --parallel 4

      - name: Smoke the binary
        # A binary that cannot even list its tasks would fail every dataset for the
        # same reason; catching it here keeps the bench matrix from repeating it.
        run: |
          build/src/apps/cli/alphashape-cli --list-tasks
          build/src/apps/cli/alphashape-cli --proj-info

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bench-cli
          path: build/src/apps/cli/alphashape-cli
          retention-days: 1
          if-no-files-found: error

  bench:
    name: Bench ${{ matrix.dataset }}
    needs: [plan, build]
    runs-on: ubuntu-24.04
    # The whole pipeline over ~100 real photographs, plus the download, has to fit
    # here; the job fails rather than running past the limit. 330 minutes is the
    # ceiling the workflow is allowed (under 6 h) and leaves headroom over the
    # measured need for both datasets at the downscale each declares.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.datasets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The CLI comes from the build job as a single file, so there is no build tree
      # to unpack and no absolute-path dependence between the two jobs.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: bench-cli
          path: build/bench/bin

      # Runtime libraries for the CLI, p7zip for the ETH3D archives. The metrics Python
      # packages are installed separately below, pinned in versions.txt.
      - name: Install runtime dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libceres4t64 libproj25 proj-data
            libtiff6 libjpeg-turbo8 libpng16-16t64 p7zip-full
          attempt-timeout: "240"
          install-timeout: "420"

      - name: Install the metrics dependencies
        # Pinned exactly, for the same reason the actions above are pinned to a
        # commit: this job records NUMBERS that are compared week over week, and a
        # silent minor-version bump in a resampler or a TIFF reader would move them
        # for a reason no commit caused. versions.txt is the one place they live.
        run: |
          python3 -m pip install --disable-pip-version-check --break-system-packages \
            -r tools/bench/requirements.txt

      - name: Smoke the binary
        run: |
          cli="$PWD/build/bench/bin/alphashape-cli"
          chmod +x "$cli"
          "$cli" --list-tasks
          "$cli" --proj-info

      # The downloads are the slowest part of a weekly run and are identical between
      # runs of the same manifest, so they are cached by manifest hash. A cache miss
      # re-downloads; a corrupt entry fails the SHA-256 check and is re-fetched.
      - name: Restore the dataset cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/bench/cache
          key: ${{ needs.plan.outputs.cache-key }}-${{ matrix.dataset }}
          restore-keys: |
            ${{ needs.plan.outputs.cache-key }}-

      - name: Show the dataset
        run: python3 tools/bench/run_bench.py --dataset "${{ matrix.dataset }}" --list

      - name: Run the benchmark
        env:
          ALPHASHAPE_CLI: ${{ github.workspace }}/build/bench/bin/alphashape-cli
          # An env var, not an interpolation into the script below. The value is a
          # dispatch input, so it is untrusted text; `run_bench.py --depth-params`
          # validates it before anything reaches the CLI. Empty for every scheduled,
          # push and ordinary manual run, which is what keeps those runs identical.
          DEPTH_PARAMS: ${{ github.event.inputs.depth_params }}
        run: |
          mkdir -p build/bench
          set +e
          python3 tools/bench/run_bench.py \
            --dataset "${{ matrix.dataset }}" \
            --depth-params "$DEPTH_PARAMS" \
            --work build/bench \
            --json "build/bench/metrics-${{ matrix.dataset }}.json" 2>&1 | tee build/bench/run.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # A failed stage must not leave its reason only in an artifact: print
            # the CLI's own last lines here, where the run page shows them.
            echo "::group::CLI log tail"
            tail -n 60 build/bench/cli.log 2>/dev/null || echo "(no cli.log)"
            echo "::endgroup::"
            echo "::error::the benchmark failed; see the log above"
            exit "$status"
          fi

      # The baseline is the metrics JSON from the last SUCCESSFUL run of this
      # workflow on the default branch. Artifacts are per-run, so the run has to be
      # located first; `gh run list` filters on the workflow and the conclusion,
      # which is what makes "last good result" the definition rather than "last
      # result".
      #
      # Two different "no baseline" cases must NOT be conflated: a genuinely first
      # run (nothing listed) is fine and the report says "first run", while an API
      # or permission error means the regression gate has been silently disabled —
      # which is worse than a red job, because every later run would pass on no
      # evidence. The download is therefore allowed to be missing (a brand-new
      # dataset has no artifact yet) but a failure of `gh` itself fails the job.
      - name: Restore the previous run
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          DATASET: ${{ matrix.dataset }}
        run: |
          mkdir -p build/bench/previous
          # A listing failure is fatal: it can only be a bad token, a missing
          # permission or a broken API, and all three mean "no gate".
          #
          # Several runs are listed, not one. An experiment dispatched on the
          # default branch succeeds without publishing a baseline, so "the newest
          # successful run" can be a run that has no artifact. Taking only that one
          # would report "first run" and disable the gate for a week. The loop below
          # keeps walking back until it finds a run that actually has one.
          if ! runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow quality-bench.yml \
                        --branch "${{ github.event.repository.default_branch }}" \
                        --status success --limit 10 --json databaseId \
                        --jq '.[].databaseId' 2>&1); then
            echo "::error::cannot list previous runs; the regression gate is disabled"
            echo "$runs"
            exit 1
          fi
          if [ -z "$runs" ]; then
            echo "no previous successful run: this is the first run, not an error"
            exit 0
          fi
          found=""
          for run_id in $runs; do
            echo "looking for a baseline in run $run_id"
            # An absent artifact on an older successful run is legitimate (a new
            # dataset, an experiment that published nothing, or an expiry older than
            # the retention below), so it moves on to the next run. gh spells that
            # absence more than one way, and the pattern has to match what it
            # actually prints: a named artifact that is not in the run is
            #   "no artifact matches any of the names or patterns provided"
            # while a run whose artifacts have all expired is
            #   "no valid artifacts found"
            # Both, plus an explicit 404 (unknown artifact) or 410/expired, mean
            # "this run has no baseline". Any other failure must NOT be swallowed:
            # a 401/403 or a network error means the gate would be silently
            # disabled, which is worse than a red job.
            rm -rf build/bench/previous
            mkdir -p build/bench/previous
            if ! err=$(gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
                         --name "bench-baseline-$DATASET" --dir build/bench/previous 2>&1); then
              case "$err" in
                *"no artifact matches"*|*"no valid artifacts found"*|\
                *"artifact"*"not found"*|*"HTTP 404"*|*"HTTP 410"*|*"has expired"*)
                  echo "  no bench-baseline-$DATASET artifact in run $run_id: $err"
                  continue
                  ;;
                *)
                  echo "::error::cannot download the baseline from run $run_id"
                  echo "$err"
                  exit 1
                  ;;
              esac
            fi
            # A published baseline is a control run by construction — the publish
            # step withholds experiments — so this is defence against an artifact
            # that reached the run some other way (a hand upload, or a past bug).
            # The gate must never compare against a configuration that is not the
            # default, and the metrics file itself is the single source of that
            # answer, so a run whose baseline reports depth_params is skipped like
            # a run with no artifact at all.
            metrics="build/bench/previous/metrics-$DATASET.json"
            set +e
            python3 tools/bench/is_experiment.py "$metrics"
            probe=$?
            set -e
            if [ "$probe" -ne 0 ]; then
              echo "  run $run_id has a baseline that is not a control run (is_experiment=$probe); skipping it"
              continue
            fi
            found="$run_id"
            echo "using baseline from run $run_id"
            break
          done
          if [ -z "$found" ]; then
            # Whatever the last skipped run downloaded is still on disk. The
            # "Find the baseline" step adopts any metrics file it finds there, so
            # an experiment that was skipped must not be left behind to be
            # mistaken for a baseline: the directory is cleared, not just ignored.
            rm -rf build/bench/previous
            mkdir -p build/bench/previous
            echo "no successful run in the last 10 has a baseline artifact; treating as a first run"
            echo "::notice::no baseline artifact in the last successful runs"
          fi

      - name: Find the baseline
        id: baseline-path
        run: |
          prev="build/bench/previous/metrics-${{ matrix.dataset }}.json"
          if [ -s "$prev" ]; then
            echo "path=$prev" >> "$GITHUB_OUTPUT"
            echo "using baseline $prev"
            # The baseline is still passed as the previous run even when it is an
            # experiment: the comparison table is exactly what an experiment is read
            # against. report.py does not gate across two different configurations,
            # and the publish step below is what keeps an experiment out of the
            # baseline, so this cannot silently adopt one.
            set +e
            python3 tools/bench/is_experiment.py "$prev"
            probe=$?
            set -e
            if [ "$probe" -ne 0 ]; then
              echo "::notice::the previous run was not a control run; the comparison is report-only"
            fi
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "no baseline; this is a first run"
          fi

      # A deliberate trade-off is adoptable, but only by hand. The
      # `accept_regression` dispatch input records why a run that failed the gate
      # should still become the baseline: the regressed metrics are named in the
      # report, the job does not fail, and the metrics JSON the next week compares
      # against carries the reason, the actor and the accepted moves. It is
      # refused on a non-default branch and on an experiment (see the input's
      # comment above). Empty — every scheduled, push and ordinary manual run —
      # skips the step and leaves the publish/fail conditions exactly as before.
      #
      # This runs BEFORE the report so the report can show the acceptance it
      # describes, and it rewrites the metrics JSON in place.
      - name: Accept regression
        id: accept
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.accept_regression != ''
        env:
          ACCEPT_REGRESSION: ${{ github.event.inputs.accept_regression }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          BASELINE: ${{ steps.baseline-path.outputs.path }}
        run: |
          python3 tools/bench/accept_regression.py \
            --current "build/bench/metrics-${{ matrix.dataset }}.json" \
            --previous "$BASELINE" \
            --branch "$BRANCH" \
            --default-branch "$DEFAULT_BRANCH" \
            --actor "$ACTOR" \
            --run-id "$RUN_ID" \
            --github-output "$GITHUB_OUTPUT"

      - name: Report
        id: report
        env:
          BASELINE: ${{ steps.baseline-path.outputs.path }}
        run: |
          args=(--current "build/bench/metrics-${{ matrix.dataset }}.json"
                --out "build/bench/report-${{ matrix.dataset }}.md"
                --png "build/bench/compare-${{ matrix.dataset }}.png"
                --fail-on-regression)
          if [ -n "$BASELINE" ]; then args+=(--previous "$BASELINE"); fi
          # A regression fails the job, but the report must still be uploaded and
          # written to the summary: the value of a red run is the evidence in it.
          # An experiment never fails it: report.py returns 0 for those, and the
          # output below is what keeps it out of the baseline.
          set +e
          python3 tools/bench/report.py "${args[@]}"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # The publish step needs to know whether this run measured a configuration
          # rather than the defaults. tools/bench/is_experiment.py reads the metrics
          # file — the single source the report and the baseline both use — and
          # exits 0 for a control run, 1 for an experiment, 2 when it cannot tell.
          # Anything but a definite 0 withholds the baseline: an unexplained run is
          # not adopted as the yardstick.
          metrics="build/bench/metrics-${{ matrix.dataset }}.json"
          set +e
          python3 tools/bench/is_experiment.py "$metrics"
          probe=$?
          set -e
          if [ "$probe" -eq 0 ]; then
            echo "experiment=false" >> "$GITHUB_OUTPUT"
          else
            echo "experiment=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Job summary
        if: always()
        run: |
          report="build/bench/report-${{ matrix.dataset }}.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bench-report-${{ matrix.dataset }}
          path: |
            build/bench/report-${{ matrix.dataset }}.md
            build/bench/metrics-${{ matrix.dataset }}.json
            build/bench/compare-${{ matrix.dataset }}.png
            build/bench/cli.log
          if-no-files-found: warn
          retention-days: 90

      # A successful run replaces the baseline the next week compares against. A
      # failing run does NOT: the baseline stays at the last good result, so a
      # regression keeps failing until it is fixed rather than being silently
      # adopted as the new normal.
      #
      # An EXPERIMENT does not either. It measured a configuration that is not the
      # default — the whole reason the dispatch input exists — and publishing it
      # would make the following week's real run compare against it and either
      # fail for no reason or quietly adopt a non-default configuration.
      #
      # 90 days is the maximum this repository's artifact policy allows (a larger
      # value is silently capped), and it is also the limit on how far back the
      # baseline can reach. A gap longer than 90 days — the workflow disabled, or
      # three months of failures — leaves no artifact to find, and the next run
      # restarts the baseline with a "first run" report rather than failing.
      #
      # An ACCEPTED regression publishes despite its failing verdict: that is the
      # whole point of the accept_regression input, and the metrics file carries
      # the reason and the accepted moves into the artifact.
      - name: Publish the new baseline
        if: (steps.report.outputs.status == '0' || steps.accept.outputs.accepted == 'true') && steps.report.outputs.experiment != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bench-baseline-${{ matrix.dataset }}
          path: build/bench/metrics-${{ matrix.dataset }}.json
          retention-days: 90
          if-no-files-found: error

      - name: Fail on regression
        # An accepted regression does not fail the job. Its report still names
        # every regressed metric, and the baseline it published says who accepted
        # the trade-off and why.
        if: steps.report.outputs.status != '0' && steps.accept.outputs.accepted != 'true'
        run: |
          echo "::error::the benchmark regressed against the previous run; see the report artifact"
          exit 1
