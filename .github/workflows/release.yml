name: Release

# Manual. Steps:
#   1. bump `VERSION x.y.z` in engine/CMakeLists.txt, commit to main
#   2. git tag vx.y.z && git push origin vx.y.z
#   3. gh workflow run release.yml -f tag=vx.y.z            (publishes)
#      gh workflow run release.yml -f tag=vx.y.z -f draft=true   (builds a private draft; publish
#      or delete it from the Releases page)
# Re-running for the same tag replaces the release only while it is still a draft. Once it is
# published the run stops with "release vx.y.z is already published": a shipped download must
# not change under its own name. Bump the version and tag again instead.
#
# Building, packaging and publishing live in publish.yml, which preview.yml shares. Everything
# after the build happens there: NOTICE.txt, sbom.spdx.json, SHA256SUMS, provenance attestations
# and the per-OS check of the published downloads.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.2.0)
        required: true
        type: string
      draft:
        description: Build everything but keep the release as an unpublished draft
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Tag matches the project version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(sed -n 's/^ *VERSION \([0-9.]*\).*/\1/p' engine/CMakeLists.txt | head -1)
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match engine/CMakeLists.txt VERSION ${version}"
            exit 1
          fi

  build:
    needs: verify
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.tag }}
      version: ${{ inputs.tag }}
      package: true

  publish:
    name: Publish release
    needs: build
    # Serialise publishes per tag: a re-run replaces the draft under this tag.
    concurrency:
      group: publish-${{ inputs.tag }}
      cancel-in-progress: false
    # A called workflow can only narrow the caller's token, so everything publish.yml's jobs
    # ask for is granted here: contents: write to create the release, id-token + attestations
    # to attest the installers, pull-requests: read for --generate-notes.
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ inputs.tag }}
      ref: ${{ inputs.tag }}
      prerelease: false
      draft: ${{ inputs.draft }}
      tag-exists: true
