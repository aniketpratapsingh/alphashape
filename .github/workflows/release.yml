name: Release

# Manual. Steps:
#   1. bump `VERSION x.y.z` in engine/CMakeLists.txt, commit to main
#   2. git tag vx.y.z && git push origin vx.y.z
#   3. gh workflow run release.yml -f tag=vx.y.z            (publishes)
#      gh workflow run release.yml -f tag=vx.y.z -f draft=true   (builds a private draft; publish
#      or delete it from the Releases page)
# Re-running for the same tag replaces the release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.2.0)
        required: true
        type: string
      draft:
        description: Build everything but keep the release as an unpublished draft
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Tag matches the project version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(sed -n 's/^ *VERSION \([0-9.]*\).*/\1/p' engine/CMakeLists.txt | head -1)
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match engine/CMakeLists.txt VERSION ${version}"
            exit 1
          fi

  build:
    needs: verify
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.tag }}
      version: ${{ inputs.tag }}
      package: true

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Only release assets are collected. The Windows artifacts also carry
      # build bookkeeping (PYTHON-ABI.txt, the payload listing, the packaging
      # job's own SHA256SUMS.txt), and "pattern: alphashape-*" with
      # merge-multiple would have published all of it -- including a second
      # SHA256SUMS that the checksum step below then hashed alongside the real
      # assets. The three platform artifacts are downloaded individually and
      # the Windows one is filtered, which is the smallest change that keeps
      # WP-29.8 free to restructure this job.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: alphashape-linux-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: alphashape-macos-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: alphashape-windows-x86_64
          path: dist-windows
      - name: Collect the Windows assets
        run: |
          find dist-windows -name '*.exe' -exec cp {} dist/ \;
          find dist-windows -name '*.zip' -exec cp {} dist/ \;
          rm -rf dist-windows
          ls -lh dist
      - name: Checksums
        run: cd dist && rm -f SHA256SUMS && sha256sum -- * > SHA256SUMS && ls -lh
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete "${{ inputs.tag }}" --yes 2>/dev/null || true
          draft=""
          if [ "${{ inputs.draft }}" = "true" ]; then draft="--draft"; fi
          gh release create "${{ inputs.tag }}" dist/* --verify-tag $draft \
            --title "alphashape ${{ inputs.tag }}" --generate-notes
