name: Pre-release

# Pushing a tag like v0.2.0-rc.1, v0.2.0-beta.1 or v0.2.0-preview.1 (from any branch) builds every
# platform and publishes a GitHub pre-release. Pre-releases never become "latest".

on:
  push:
    tags:
      - "v*-rc*"
      - "v*-beta*"
      - "v*-preview*"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.ref }}
      version: ${{ github.ref_name }}
      package: true

  prerelease:
    name: Publish pre-release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Same asset selection as release.yml: the Windows artifacts carry build
      # bookkeeping (PYTHON-ABI.txt, payload.txt, the packaging job's own
      # SHA256SUMS.txt) that must not be published, so only the three platform
      # artifacts are collected and the Windows one is filtered to .exe/.zip.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: alphashape-linux-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: alphashape-macos-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: alphashape-windows-x86_64
          path: dist-windows
      - name: Collect the Windows assets
        run: |
          find dist-windows -name '*.exe' -exec cp {} dist/ \;
          find dist-windows -name '*.zip' -exec cp {} dist/ \;
          rm -rf dist-windows
          ls -lh dist
      - name: Checksums
        run: cd dist && rm -f SHA256SUMS && sha256sum -- * > SHA256SUMS && ls -lh
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --prerelease --latest=false \
            --title "alphashape ${GITHUB_REF_NAME} (pre-release)" --generate-notes
