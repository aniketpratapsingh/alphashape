name: CI

# Runs on every pull request to main, every push to main, and on demand. All jobs run in parallel;
# "CI OK" at the bottom depends on all of them and is the single check required on main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: Also build and smoke-test the release packages (.deb, AppImage, DMG, archives)
        type: boolean
        default: false

# A new push to the same pull request cancels the older, now-stale run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Repository hygiene
        run: tools/check_repo_hygiene.sh
      - name: Seeded-RNG evaluation order
        run: python3 engine/tools/check_rng_order.py engine/src engine/tests
      - name: Release metadata generators
        # NOTICE.txt and sbom.spdx.json are generated from packaging/licenses/deps.yaml at
        # release time; a change to the parser or the renderer must not wait for a release to
        # find out it is broken.
        run: python3 packaging/tests/test_release_metadata.py
      - name: No reverse-engineering material
        run: |
          if grep -rInE 'research/[0-9]|studied (product|implementation)|decompil|ghidra' \
               --include='*.cpp' --include='*.hpp' --include='*.h' --include='*.py' \
               --include='*.cmake' --include='CMakeLists.txt' --include='*.md' engine; then
            echo "::error::References to reverse-engineering material are not allowed in this repository."
            exit 1
          fi

  # Pull requests that touch packaging build and smoke-test the packages too, so packaging can be
  # iterated on without cutting a release.
  changes:
    name: Packaging files changed?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      package: ${{ steps.filter.outputs.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          REQUESTED: ${{ inputs.package }}
        run: |
          package=false
          if [ "$REQUESTED" = true ]; then package=true; fi
          if [ "$EVENT" = pull_request ] && git diff --name-only "$BASE" HEAD |
               grep -qE '^(packaging/|engine/cmake/alphashape_(install|macos_bundle|windows_install)\.cmake|\.github/workflows/(build|ci|publish|preview|release)\.yml)'; then
            package=true
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: changes
    uses: ./.github/workflows/build.yml
    with:
      package: ${{ needs.changes.outputs.package == 'true' }}
      # PRs run the light lanes only; main runs everything (see .github/ci/test-lanes.json).
      full: ${{ github.event_name != 'pull_request' }}

  # CI OK depends on `build`, which is the whole reusable build.yml run, so every
  # job inside it gates CI OK by failing that run -- including the packaging jobs
  # (linux-package-smoke, macos-package-smoke, windows-package,
  # windows-package-smoke). When `package` is false those jobs are skipped and a
  # skipped job inside a reusable workflow does not fail it.
  ci-ok:
    name: CI OK
    if: always()
    needs: [checks, changes, build]
    runs-on: ubuntu-24.04
    steps:
      - name: All required jobs passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "A required job did not pass:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
