name: Build

# Reusable build + test + package for Linux, macOS and Windows. Called by ci.yml, nightly.yml,
# preview.yml and release.yml so every channel builds exactly the same way.
#
# Per OS: one build job (ccache / vcpkg cache, packaging) uploads the build tree minus object files,
# then a matrix of test jobs unpacks it and runs one ctest slice each. The slices come from
# .github/ci/test-lanes.json: N stride shards of the light tests, plus (when `full`) a few lanes of
# heavy tests. The shard-coverage job proves the slices together are exactly the full test list.

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (default: the triggering commit)"
        type: string
        default: ""
      version:
        description: Version string stamped into archive names
        type: string
        default: dev
      package:
        description: Produce downloadable archives
        type: boolean
        default: false
      full:
        description: Run the heavy pipeline test lanes too (see .github/ci/test-lanes.json)
        type: boolean
        default: true
      windows-required:
        description: Fail the call when the Windows job fails
        type: boolean
        default: true

permissions:
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 1500M
  CTEST_OUTPUT_ON_FAILURE: "1"
  OMP_NUM_THREADS: "4"
  OMP_WAIT_POLICY: passive
  # Shared runners: report GPU speed-ups, do not fail on them (see engine/tests/perf_gate.hpp).
  ALPHASHAPE_PERF_ASSERTS: "0"
  VMA_TAG: v3.1.0

jobs:
  plan:
    name: Plan test lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      linux: ${{ steps.matrix.outputs.linux }}
      macos: ${{ steps.matrix.outputs.macos }}
      windows: ${{ steps.matrix.outputs.windows }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - id: matrix
        env:
          FULL: ${{ inputs.full }}
        run: |
          # shellcheck disable=SC2016  # jq program, not shell, expands these
          prog='
            . as $c
            | ($c.heavy | map(.tests[]) | map(gsub("\\."; "\\.")) | join("|")) as $all
            | def rx($t): "^(" + ($t | map(gsub("\\."; "\\.")) | join("|")) + ")$";
              def light($n): [range(1; $n + 1) as $i
                  | {lane: "light-\($i)-of-\($n)", flag: "-E", regex: ("^(" + $all + ")$"), index: $i, total: $n}];
              def heavy: $c.heavy | map({lane: ("heavy-" + .name), flag: "-R", regex: rx(.tests), index: 0, total: 0});
              def merged: [{lane: "heavy", flag: "-R", regex: ("^(" + $all + ")$"), index: 0, total: 0}];
              def mac: if $full or ($c.heavy_on_pr | index("macos")) then merged else [] end;
            {
              linux:   {include: (light($c.light_shards.linux)   + (if $full then heavy else [] end))},
              windows: {include: (light($c.light_shards.windows) + (if $full then heavy else [] end))},
              macos:   {include: (light($c.light_shards.macos)   + mac)}
            }'
          jq -c --argjson full "$FULL" "$prog" .github/ci/test-lanes.json > matrix.json
          for os in linux macos windows; do
            echo "$os=$(jq -c ".$os" matrix.json)" >> "$GITHUB_OUTPUT"
          done
          jq . matrix.json

  linux:
    name: Linux x86-64 (GCC, lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install dependencies
        run: |
          # The hosted mirrors occasionally stall; bound each attempt and retry.
          apt_retry() { for i in 1 2 3 4; do sudo timeout 180 apt-get -q -o Acquire::Retries=3 -o Acquire::http::Timeout=20 "$@" && return 0; echo "apt attempt $i failed or timed out"; done; return 1; }
          apt_retry update
          apt_retry install -y --no-install-recommends build-essential cmake ninja-build ccache \
            libeigen3-dev libceres-dev libproj-dev proj-data zlib1g-dev libjpeg-dev libpng-dev \
            libtiff-dev libgtest-dev pybind11-dev python3-dev libvulkan-dev glslc spirv-tools \
            mesa-vulkan-drivers vulkan-validationlayers vulkan-tools \
            libgl-dev libopengl-dev libegl-dev libxkbcommon-dev libfontconfig1-dev libdbus-1-dev
          sudo mkdir -p /usr/include/vma
          sudo curl -fsSL --retry 3 --max-time 60 -o /usr/include/vma/vk_mem_alloc.h \
            "https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/${VMA_TAG}/include/vk_mem_alloc.h"

      - name: Install Qt 6.8 (GUI)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125  # v4.4.1
        env:
          # Distro pythons are "externally managed"; aqtinstall must be allowed to install.
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        with:
          version: "6.8.3"
          # qtshadertools provides qsb and qt_add_shaders(), which compile the viewport's
          # GLSL to the .qsb files every QRhi backend loads.
          modules: "qtshadertools"
          cache: true
          setup-python: false

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-linux-gcc-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-gcc-${{ github.ref_name }}-
            ccache-linux-gcc-main-

      - name: Configure
        run: |
          cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DALPHASHAPE_WARNINGS_AS_ERRORS=ON \
            -DALPHASHAPE_BUILD_GUI=ON -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          # A missing Vulkan tool silently turns the GPU layer off; refuse that in CI.
          grep -q 'ALPHASHAPE_GPU_HAS_VULKAN 1' build/src/gpu/generated/gpu/gpu_config.hpp

      - name: Build
        run: cmake --build build --parallel 4

      - name: Pack test tree
        run: |
          ctest --test-dir build -N | sed -nE 's/^ +Test +#[0-9]+: (.*)$/\1/p' > tests-all.txt
          wc -l tests-all.txt
          tar --zstd -cf build.tar.zst --exclude='*.o' --exclude='*.a' --exclude=.ninja_deps build
          ls -lh build.tar.zst

      - uses: actions/upload-artifact@v7
        with:
          name: build-linux
          path: build.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: tests-linux-all
          path: tests-all.txt
          retention-days: 1

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Package (tar.gz)
        if: inputs.package
        run: |
          name="alphashape-${{ inputs.version }}-linux-x86_64"
          mkdir -p "dist/$name"
          cp build/src/apps/cli/alphashape-cli "dist/$name/"
          find build/python -maxdepth 2 -name 'alphashape*.so' -exec cp {} "dist/$name/" \;
          cp README.md LICENSE engine/LIMITATIONS.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      # .deb: the GUI's Qt 6.8 is bundled privately (Ubuntu 24.04 only has Qt 6.4), see
      # packaging/linux/README.md. Packaging reuses the build tree; only install rules change.
      - name: Package (.deb)
        if: inputs.package
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream
          desktop-file-validate packaging/linux/org.alphashape.app.desktop
          cmake -S engine -B build -DALPHASHAPE_BUNDLE_QT=ON -DALPHASHAPE_BUNDLE_PROJ_DATA=OFF
          (cd build && cpack -G DEB)
          deb=$(ls build/alphashape_*_amd64.deb)
          cp "$deb" "dist/alphashape-${{ inputs.version }}-linux-amd64.deb"
          appstreamcli validate --no-net build/org.alphashape.app.metainfo.xml
          dpkg-deb -I "$deb"
          ls -lh dist

      # AppImage: linuxdeploy + the Qt plugin bundle every non-glibc dependency. It ships PROJ data
      # itself (no proj-data package to rely on) and no Python module.
      - name: Package (AppImage)
        if: inputs.package
        run: |
          cmake -S engine -B build -DALPHASHAPE_BUNDLE_QT=OFF -DALPHASHAPE_BUNDLE_PROJ_DATA=ON
          packaging/linux/build-appimage.sh build "dist/alphashape-${{ inputs.version }}-linux-x86_64.AppImage"
          ls -lh dist

      - uses: actions/upload-artifact@v7
        if: inputs.package
        with:
          name: alphashape-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  # Install the packages the way a user would, on a clean Ubuntu 24.04, and run them.
  linux-package-smoke:
    name: Linux packages (clean ubuntu:24.04)
    needs: linux
    if: inputs.package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: alphashape-linux-x86_64
          path: dist
      - name: Package sizes
        run: ls -l dist
      - name: .deb in a clean container
        run: |
          docker run --rm -v "$PWD:/w:ro" ubuntu:24.04 \
            bash -c 'bash /w/packaging/linux/smoke-deb.sh /w/dist/*.deb /w/engine/data'
      - name: AppImage in a clean container (no FUSE)
        run: |
          docker run --rm -v "$PWD:/w:ro" ubuntu:24.04 \
            bash -c 'bash /w/packaging/linux/smoke-appimage.sh /w/dist/*.AppImage /w/engine/data'

  macos:
    name: macOS arm64 (Clang, MoltenVK)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install dependencies
        run: |
          brew install ninja ccache eigen ceres-solver proj libtiff libpng jpeg-turbo googletest \
            pybind11 libomp molten-vk vulkan-loader vulkan-headers vulkan-tools shaderc spirv-tools \
            vulkan-validationlayers
          prefix="$(brew --prefix)"
          mkdir -p "$prefix/include/vma"
          curl -fsSL --retry 3 --max-time 60 -o "$prefix/include/vma/vk_mem_alloc.h" \
            "https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/${VMA_TAG}/include/vk_mem_alloc.h"

      - name: Install Qt 6.8 (GUI)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125  # v4.4.1
        env:
          # Distro pythons are "externally managed"; aqtinstall must be allowed to install.
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        with:
          version: "6.8.3"
          # qtshadertools provides qsb and qt_add_shaders(), which compile the viewport's
          # GLSL to the .qsb files every QRhi backend loads.
          modules: "qtshadertools"
          cache: true
          setup-python: false

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-macos-clang-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-clang-${{ github.ref_name }}-
            ccache-macos-clang-main-

      - name: Configure
        run: |
          cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DALPHASHAPE_WARNINGS_AS_ERRORS=ON -DALPHASHAPE_GPU=ON \
            -DALPHASHAPE_BUILD_GUI=ON -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          grep -q 'ALPHASHAPE_GPU_HAS_VULKAN 1' build/src/gpu/generated/gpu/gpu_config.hpp

      - name: Build
        run: cmake --build build --parallel 3

      - name: Pack test tree
        run: |
          ctest --test-dir build -N | sed -nE 's/^ +Test +#[0-9]+: (.*)$/\1/p' > tests-all.txt
          wc -l tests-all.txt
          tar --zstd -cf build.tar.zst --exclude='*.o' --exclude='*.a' --exclude=.ninja_deps build
          ls -lh build.tar.zst

      - uses: actions/upload-artifact@v7
        with:
          name: build-macos
          path: build.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: tests-macos-all
          path: tests-all.txt
          retention-days: 1

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats || true

      # alphashape.app is assembled from the build tree: Qt via macdeployqt, every other Homebrew
      # library, the Vulkan loader, MoltenVK and the PROJ data by packaging/macos. Ad-hoc signed.
      # build-app.sh prints the size breakdown and the 20 largest files, so a regression that
      # adds a bulky resource shows up in this log.
      - name: Package (.app, .dmg)
        if: inputs.package
        run: |
          brew install librsvg
          export PATH="$QT_ROOT_DIR/bin:$PATH"
          packaging/macos/build-app.sh build dist/app
          packaging/macos/build-dmg.sh dist/app/alphashape.app \
            "dist/alphashape-${{ inputs.version }}-macos-arm64.dmg"
          ls -lh dist/*.dmg

      # Size guard. The bundle was 520 MB when this job copied Homebrew's complete proj-data
      # collection instead of a curated subset; the guard keeps that from coming back. The job
      # produces about 58 MB, so the budget is roughly 20% above that.
      - name: DMG size guard
        if: inputs.package
        run: |
          # Compare bytes, not rounded megabytes: 72.9 MB must fail a 72 MB budget.
          budget_bytes=$(( 72 * 1048576 ))
          budget_mb=$(( budget_bytes / 1048576 ))
          shopt -s nullglob
          dmgs=(dist/*-macos-arm64.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one dist/*-macos-arm64.dmg, found ${#dmgs[@]}"
            ls -l dist >&2 || true
            exit 1
          fi
          dmg=${dmgs[0]}
          bytes=$(stat -f %z "$dmg")
          if [ "$bytes" -le 0 ]; then
            echo "::error::$dmg is empty (${bytes} bytes)"
            exit 1
          fi
          mb=$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1048576 }')
          echo "DMG: $dmg, ${mb} MB (budget ${budget_mb} MB)"
          if [ "$bytes" -gt "$budget_bytes" ]; then
            echo "::error::the macOS DMG is ${mb} MB, over the ${budget_mb} MB budget"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: inputs.package
        with:
          name: alphashape-macos-arm64
          path: dist/*.dmg
          if-no-files-found: error

  # Mount the DMG on a fresh runner with Homebrew moved out of the way, then run everything.
  macos-package-smoke:
    name: macOS DMG (fresh runner, no Homebrew)
    needs: macos
    if: inputs.package
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: alphashape-macos-arm64
          path: dist
      - name: Package size
        run: ls -l dist
      - name: Python version the module was built for
        id: py
        run: |
          mnt="$(mktemp -d)"
          hdiutil attach dist/*.dmg -mountpoint "$mnt" -nobrowse -readonly
          so="$(ls "$mnt"/alphashape.app/Contents/Resources/python/*.so)"
          hdiutil detach "$mnt"
          echo "version=$(basename "$so" | sed -E 's/.*cpython-3([0-9]+)-darwin.*/3.\1/')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.py.outputs.version }}
      - name: Hide Homebrew
        run: sudo mv /opt/homebrew /opt/homebrew.hidden
      - name: Install and run from the DMG
        run: packaging/macos/smoke-app.sh dist/*.dmg engine/data

  windows:
    name: Windows x86-64 (clang-cl, lavapipe)
    runs-on: windows-2022
    timeout-minutes: 120
    continue-on-error: ${{ !inputs.windows-required }}
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-bincache
      # pybind11 and its python3 port are absent on purpose: that port ships a
      # vcpkg-cmake-wrapper which forces its own Python headers and libraries
      # into find_package(Python3) whenever Development.Module is requested, so
      # the .pyd could only ever be built for vcpkg's interpreter. The packaging
      # step installs pybind11's headers into the setup-python interpreter
      # instead (`pip install pybind11`), which is the one the installer is
      # supposed to carry a module for.
      #
      # The Vulkan entries are what the GPU layer is built against:
      #   vulkan-headers          <vulkan/vulkan_core.h> (VK_NO_PROTOTYPES: nothing links a loader)
      #   vulkan-memory-allocator  <vma/vk_mem_alloc.h>
      #   shaderc                  glslc.exe, in tools\shaderc
      #   spirv-tools[tools]       spirv-val.exe, in tools\spirv-tools
      # vulkan-loader is deliberately absent: the installer must not ship
      # vulkan-1.dll (it would shadow the driver's own loader and could not find
      # the driver's ICDs), and nothing links against it. The test lanes install
      # it separately, because a Windows runner image has no Vulkan runtime.
      VCPKG_PACKAGES: eigen3 ceres[eigensparse] proj[core,tiff] libjpeg-turbo libpng tiff gtest zlib vulkan-headers vulkan-memory-allocator shaderc spirv-tools[tools]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: .vcpkg-bincache
          key: vcpkg-x64-windows-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: vcpkg-x64-windows-

      - name: Install dependencies (vcpkg)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows `
            $env:VCPKG_PACKAGES.Split(' ')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The loader is a *test* dependency and the four test lanes each
          # restore this binary cache read-only, so it is built once here rather
          # than four times in parallel. Nothing links it and no payload ships
          # it: the installer excludes it by name, and the .zip below drops it.
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows vulkan-loader
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Pin the interpreter: CMake bakes its absolute path into the rng_order_check test, and the
      # test shards must find the same one (image Python patch versions differ between runners).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: x64

      - name: Install Qt 6.8 (GUI)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125  # v4.4.1
        env:
          # Distro pythons are "externally managed"; aqtinstall must be allowed to install.
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          modules: "qtshadertools"
          cache: true
          setup-python: false

      - name: Configure
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
          # The Python module and the installer are configured later, in the
          # Package step: this configuration is what the test lanes unpack, so it
          # stays exactly what it always was.
          #
          # ALPHASHAPE_GPU=ON is explicit rather than left to the option's
          # default so a missing Vulkan piece is a configuration failure instead
          # of a quiet CPU-only build. engine/cmake/alphashape_vulkan.cmake finds
          # the vcpkg headers through the toolchain and glslc/spirv-val under
          # installed/x64-windows/tools/<port>.
          cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows -DALPHASHAPE_WARNINGS_AS_ERRORS=ON `
            -DALPHASHAPE_BUILD_PYTHON=OFF -DALPHASHAPE_GPU=ON `
            -DALPHASHAPE_BUILD_GUI=ON "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # A missing Vulkan tool silently turns the GPU layer off; refuse that in
          # CI, exactly as the Linux and macOS jobs do.
          $config = "build/src/gpu/generated/gpu/gpu_config.hpp"
          if (-not (Test-Path -LiteralPath $config)) { throw "$config was not generated" }
          if (-not (Select-String -LiteralPath $config -Pattern 'ALPHASHAPE_GPU_HAS_VULKAN 1' -Quiet)) {
            Get-Content $config | Write-Host
            throw 'ALPHASHAPE_GPU_HAS_VULKAN is not 1: the Vulkan headers or the shader tools were not found'
          }

      - name: Build
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
          # -k 0: report every compile error in one run while the port is in progress.
          cmake --build build --parallel 4 -- -k 0

      - name: List tests
        shell: pwsh
        timeout-minutes: 5
        run: |
          $env:PATH = "C:\Program Files\LLVM\bin;$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin;$env:PATH"
          $lines = ctest --test-dir build -N | ForEach-Object { if ($_ -match '^\s+Test\s+#\d+: (.*)$') { $Matches[1] } }
          $lines | Set-Content -Encoding ascii tests-all.txt
          "tests: $($lines.Count)"

      - name: Pack test tree
        shell: cmd
        timeout-minutes: 15
        run: |
          %SystemRoot%\System32\tar.exe -czf build.tar.gz --exclude=*.obj --exclude=*.lib --exclude=.ninja_deps build
          dir build.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: build-windows
          path: build.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: tests-windows-all
          path: tests-all.txt
          retention-days: 1

      - name: Package
        if: inputs.package
        shell: pwsh
        run: |
          $name = "alphashape-${{ inputs.version }}-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist\$name" | Out-Null
          Copy-Item build\src\apps\cli\alphashape-cli.exe "dist\$name\"
          # Everything the build needs at run time, minus the two DLLs that are
          # only there for the shader tools and the test lanes. vulkan-1.dll in
          # particular must not travel: the app opens the driver's own loader by
          # name, and a copy beside the .exe would be found first.
          Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" |
            Where-Object { $_.Name -notin @('vulkan-1.dll', 'SPIRV-Tools-shared.dll') } |
            Copy-Item -Destination "dist\$name\"
          Copy-Item "C:\Program Files\LLVM\bin\libomp.dll" "dist\$name\" -ErrorAction SilentlyContinue
          Copy-Item README.md, LICENSE, engine\LIMITATIONS.md "dist\$name\"
          Compress-Archive -Path "dist\$name" -DestinationPath "dist\$name.zip"

      # NSIS installer. The configure above deliberately leaves the Python module
      # and the install rules off, so the test lanes unpack exactly the tree they
      # always did; this step turns both on in the same build directory (object
      # files survive, only the module and the installer's inputs are new).
      - name: Package (NSIS installer)
        if: inputs.package
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
          # The module is built against the interpreter actions/setup-python
          # installed earlier in this job (3.12), not against whatever else is
          # on the image: a .pyd is loadable only by the CPython whose ABI it
          # was compiled for, and the smoke job installs the version in
          # PYTHON-ABI.txt, so the two must be the same interpreter family.
          #
          # pybind11 comes from pip for the same reason. The vcpkg port is not
          # installed (see VCPKG_PACKAGES above) because its python3 port's
          # CMake wrapper replaces the Development.Module result with vcpkg's
          # own interpreter, which is exactly the mismatch this step exists to
          # prevent.
          if (-not $env:pythonLocation) { throw 'pythonLocation is not set; actions/setup-python must run before the package step' }
          $python = Join-Path $env:pythonLocation 'python.exe'
          if (-not (Test-Path -LiteralPath $python)) { throw "no python.exe under $env:pythonLocation" }
          & $python -m pip install --disable-pip-version-check --no-input pybind11==2.13.6
          if ($LASTEXITCODE -ne 0) { throw 'pip install pybind11 failed' }
          $pybind11Dir = (& $python -c "import pybind11, sys; sys.stdout.write(pybind11.get_cmake_dir())").Trim()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath (Join-Path $pybind11Dir 'pybind11Config.cmake'))) {
            throw "pybind11's CMake package was not found at '$pybind11Dir'"
          }
          & $python -c "import sys; print('packaging with Python ' + sys.version.split()[0])"
          cmake -S engine -B build `
            -DALPHASHAPE_BUILD_PYTHON=ON -DALPHASHAPE_BUILD_INSTALLER=ON `
            -DALPHASHAPE_PACKAGE_VERSION="${{ inputs.version }}" `
            "-DPython3_ROOT_DIR=$env:pythonLocation" `
            -DPython3_FIND_STRATEGY=LOCATION -DPython3_FIND_REGISTRY=NEVER `
            "-DPython3_EXECUTABLE=$python" `
            "-Dpybind11_DIR=$pybind11Dir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # engine/python/CMakeLists.txt writes dist/PYTHON-ABI.txt: the version
          # the module was configured against, which the smoke job installs.
          $abi = (Get-Content build/dist/PYTHON-ABI.txt -Raw).Trim()
          "module built for Python $abi"
          $expected = (& $python -c "import sys; print(str(sys.version_info[0]) + '.' + str(sys.version_info[1]) + '.' + str(sys.version_info[2]))").Trim()
          if ($abi -ne $expected) {
            throw "the module was configured for Python $abi, but $python is $expected"
          }
          # The module is new; the GUI relinks because the install rules add its
          # icon and version resource to it. Everything else is already built.
          cmake --build build --target alphashape_python alphashape-gui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # NSIS ships on the runner image (Program Files (x86)\NSIS, on PATH via
          # the image's machine Path). CPack fails with a clear message if not.
          # The output directory comes from CPACK_OUTPUT_FILE_PREFIX in the
          # generated CPackConfig.cmake (build/dist), so -B is not repeated here.
          cpack --config build/CPackConfig.cmake -G NSIS
          if ($LASTEXITCODE -ne 0) {
            # CPack writes the compiler's own output next to the generated
            # script; print it, because "Problem running NSIS command" alone
            # does not say which line failed.
            Get-ChildItem build/_CPack_Packages -Recurse -Filter NSISOutput.log -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "---- $($_.FullName)"; Get-Content $_.FullName }
            exit 1
          }
          $installer = Get-ChildItem build/dist -Filter *.exe
          if (-not $installer) { throw 'cpack produced no installer in build/dist' }
          $installer | ForEach-Object {
            "installer: $($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB"
          }
          # Flat, beside the .zip, so the artifact upload and every consumer
          # have one directory to look in.
          Copy-Item build/dist/*.exe dist/
          Copy-Item build/dist/PYTHON-ABI.txt dist/

      - uses: actions/upload-artifact@v7
        if: inputs.package
        with:
          name: alphashape-windows-x86_64
          # CPack writes the installer and PYTHON-ABI.txt into build/dist;
          # copy them up so the artifact has one flat top level and every
          # consumer can look for *.exe in one place.
          path: |
            dist/*.zip
            dist/*.exe
            dist/PYTHON-ABI.txt
          if-no-files-found: error

  # The installer is attested here: SHA-256 for the download instructions in
  # packaging/windows/README-smartscreen.md, a listing of what the payload
  # actually contains, and the size budget.
  windows-package:
    name: Windows installer
    needs: windows
    if: inputs.package && !cancelled()
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      MAX_INSTALLER_MB: "350"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # upload-artifact stores everything relative to the uploaded files' common
      # ancestor. The build job uploads only "dist/..." now, so that ancestor is
      # dist/ and the entries are bare file names: downloading into dist/
      # reproduces the layout the rest of this job looks for.
      - uses: actions/download-artifact@v8
        with:
          name: alphashape-windows-x86_64
          path: dist

      # 7-Zip reads inside the NSIS installer, so this is the payload as
      # CPack and windeployqt actually produced it rather than what a build log
      # claims they staged. 7zip is on the runner image; the install path is
      # probed because the image does not always put it on PATH.
      - name: Payload breakdown
        shell: pwsh
        run: |
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) {
            foreach ($candidate in 'C:\Program Files\7-Zip\7z.exe',
                                   'C:\Program Files (x86)\7-Zip\7z.exe') {
              if (Test-Path -LiteralPath $candidate) { $sevenZip = $candidate; break }
            }
          }
          if (-not $sevenZip) { throw '7z.exe not found on the runner image' }
          $installerFile = Get-ChildItem dist -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $installerFile) { throw 'no installer artifact' }
          # The download size, which is what the 350 MB budget is about, plus the
          # install size a user ends up with.
          $mb = $installerFile.Length / 1MB
          "installer: {0} {1:N1} MB (budget {2} MB)" -f $installerFile.Name, $mb, $env:MAX_INSTALLER_MB
          if ($mb -gt [double]$env:MAX_INSTALLER_MB) {
            throw ("installer is {0:N1} MB, over the {1} MB budget" -f $mb, $env:MAX_INSTALLER_MB)
          }

          # -slt prints one "Path = ..." line per payload entry, which is stable
          # across 7-Zip versions; the columnar listing is not. 7-Zip reports the
          # paths with '/' separators, relative to the install root, so they are
          # normalised before comparing (checked against a real installer: the
          # output is "bin/alphashape.exe", "python/alphashape.pyd", ...).
          $raw = & $sevenZip l -slt $installerFile.FullName | ForEach-Object {
            if ($_ -match '^Path = (.*)$') { $Matches[1] }
          }
          $paths = @($raw | ForEach-Object { $_.Replace('\', '/') })
          $paths | Set-Content -Encoding ascii payload.txt
          "payload: $($paths.Count) entries"
          $dlls = @($paths | Where-Object { $_ -like '*.dll' })
          "payload DLLs: $($dlls.Count)"
          $paths | Where-Object { $_ -like 'bin/Qt6*' } | Select-Object -First 6
          if ($dlls.Count -lt 20) {
            throw "only $($dlls.Count) DLLs in the payload; Qt or the vcpkg runtime did not deploy"
          }
          # The GPU layer loads the system loader rather than shipping one: a
          # private vulkan-1.dll would shadow the driver's own loader and could
          # not see the driver's ICDs, and Windows has no rpath-style override
          # to recover from that. A machine without a Vulkan driver must start
          # the app and fall back to the CPU, which windows-package-smoke
          # asserts with --gpu-info.
          if ($paths | Where-Object { $_ -like 'bin/vulkan-1.dll' }) {
            throw 'bin/vulkan-1.dll is in the payload; the installer must use the driver-provided loader'
          }
          foreach ($required in 'bin/platforms/qwindows.dll', 'bin/platforms/qoffscreen.dll',
                                'bin/alphashape.exe', 'bin/alphashape-cli.exe',
                                'share/proj/proj.db', 'LICENSES/LICENSE',
                                'LICENSES/THIRD-PARTY-NOTICES.txt',
                                'LICENSES/Qt/LGPL-3.0-only.txt') {
            if (-not ($paths | Where-Object { $_ -like "*$required" })) {
              throw "$required is not in the installer payload"
            }
          }
          # The licence texts of the shipped third-party runtime. The glob at
          # configure time copies whatever vcpkg installed; these are the ports
          # known to be in the payload today, so losing one would mean the glob
          # stopped following vcpkg rather than that a port was removed.
          foreach ($port in 'libjpeg-turbo', 'tiff', 'libpng', 'proj', 'ceres', 'libomp') {
            $want = "LICENSES/third-party/$port.txt"
            if (-not ($paths | Where-Object { $_ -like "*$want" })) {
              throw "$want is not in the installer payload"
            }
          }
          $licences = @($paths | Where-Object { $_ -like 'LICENSES/third-party/*.txt' })
          "payload third-party licences: $($licences.Count)"
          if ($licences.Count -lt 8) {
            throw "only $($licences.Count) third-party licence texts; the vcpkg share glob did not run"
          }
          # The module ships under the ABI-tagged name CMake gives it
          # (alphashape.cp312-win_amd64.pyd), so the tag is matched rather than
          # a fixed file name.
          if (-not ($paths | Where-Object { $_ -like 'python/alphashape*.pyd' })) {
            throw 'the Python module is not in the installer payload'
          }
          $pyd = ($paths | Where-Object { $_ -like 'python/alphashape*.pyd' } | Select-Object -First 1)
          "payload python module: $pyd"
          "payload contains every expected file"

      - name: SHA-256
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe -Recurse | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Tee-Object -FilePath dist/SHA256SUMS.txt -Append
          }
          Get-Content dist/SHA256SUMS.txt
          # The ABI file the smoke job needs to pick its interpreter; it comes
          # from the build job's artifact and is republished here so the smoke
          # job downloads one artifact, not two.
          $abi = Get-ChildItem dist -Filter PYTHON-ABI.txt -Recurse | Select-Object -First 1
          if (-not $abi) { throw 'PYTHON-ABI.txt did not survive the build artifact' }
          "python ABI: $((Get-Content $abi.FullName -Raw).Trim())"

      - uses: actions/upload-artifact@v7
        with:
          name: alphashape-windows-installer
          path: |
            dist/SHA256SUMS.txt
            dist/PYTHON-ABI.txt
            dist/*.exe
            payload.txt
          if-no-files-found: error

  # A fresh runner with no build dependencies at all: download the one .exe,
  # install it silently in both install modes, run everything, uninstall, and
  # prove the install directory and both registry keys are gone.
  windows-package-smoke:
    name: Windows installer (fresh runner)
    needs: windows-package
    if: inputs.package && !cancelled()
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # This artifact was uploaded from "dist/*.exe" plus "payload.txt" at the
      # repository root, so its common ancestor is the root and the entries keep
      # their "dist/" prefix. Downloading into "." therefore lands them in dist/.
      - uses: actions/download-artifact@v8
        with:
          name: alphashape-windows-installer
          path: .

      # The .pyd is loadable only by the CPython it was built against. Its file
      # name carries the tag, but the patch level matters too, so the build job
      # publishes the exact version and this job installs that minor release.
      - name: Python version the module was built for
        id: abi
        shell: pwsh
        run: |
          $file = Get-ChildItem dist -Filter PYTHON-ABI.txt -Recurse | Select-Object -First 1
          if (-not $file) { throw 'PYTHON-ABI.txt is missing from the artifact' }
          $version = (Get-Content $file.FullName -Raw).Trim()
          # setup-python wants major.minor; the cache carries the patch too.
          $minor = ($version -split '\.')[0..1] -join '.'
          "module built for $version, installing $minor"
          "minor=$minor" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.abi.outputs.minor }}

      - name: Install, run and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter *.exe -Recurse | Select-Object -First 1
          packaging/windows/smoke.ps1 -Installer $installer.FullName `
              -PythonVersion "${{ steps.abi.outputs.minor }}"

  # ---- test lanes: one job per matrix entry, each runs a ctest slice of the build above ----

  linux-test:
    name: Linux test ${{ matrix.lane }}
    needs: [plan, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.linux) }}
    steps:
      # The build tree holds absolute paths (fixtures, binaries), so the workspace path must match
      # the build job: same runner image, same repository, same checkout location.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # The Azure apt mirror is intermittently throttled to a crawl; keep the .debs between runs so
      # the shards usually install without downloading anything.
      - name: Restore apt package cache
        uses: actions/cache@v6
        with:
          path: ~/apt-debs
          # Bump the suffix when the package list below changes.
          key: apt-linux-runtime-v3

      - name: Install runtime dependencies
        run: |
          # The hosted mirrors occasionally stall; bound each attempt and retry.
          apt_retry() { for i in 1 2 3 4; do sudo timeout 180 apt-get -q -o Acquire::Retries=3 -o Acquire::http::Timeout=20 "$@" && return 0; echo "apt attempt $i failed or timed out"; done; return 1; }
          mkdir -p ~/apt-debs
          sudo cp -n ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          apt_retry update
          # Runtime libraries only (cmake and Python come with the image): the Azure mirror is slow
          # enough that every avoided megabyte matters.
          apt_retry install -y --no-install-recommends libceres4t64 libproj25 proj-data libtiff6 \
            libjpeg-turbo8 libpng16-16t64 libvulkan1 mesa-vulkan-drivers vulkan-validationlayers vulkan-tools \
            libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            xvfb xauth libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxkbcommon-x11-0 libxcb-xkb1
          cp /var/cache/apt/archives/*.deb ~/apt-debs/ || true

      - name: Install Qt 6.8 (GUI)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125  # v4.4.1
        env:
          # Distro pythons are "externally managed"; aqtinstall must be allowed to install.
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        with:
          version: "6.8.3"
          # qtshadertools provides qsb and qt_add_shaders(), which compile the viewport's
          # GLSL to the .qsb files every QRhi backend loads.
          modules: "qtshadertools"
          cache: true
          setup-python: false

      - uses: actions/download-artifact@v8
        with:
          name: build-linux

      - name: Unpack build tree
        run: tar --zstd -xf build.tar.zst

      - name: Select tests
        env:
          FLAG: ${{ matrix.flag }}
          REGEX: ${{ matrix.regex }}
          INDEX: ${{ matrix.index }}
          TOTAL: ${{ matrix.total }}
        run: |
          args=("$FLAG" "$REGEX")
          if [ "$INDEX" != 0 ]; then args+=(-I "$INDEX,,$TOTAL"); fi
          printf '%s\n' "${args[@]}" > ctest-args.txt
          ctest --test-dir build -N "${args[@]}" | sed -nE 's/^ +Test +#[0-9]+: (.*)$/\1/p' > tests-lane.txt
          echo "tests in this lane: $(wc -l < tests-lane.txt)"

      - uses: actions/upload-artifact@v7
        with:
          name: tests-linux-${{ matrix.lane }}
          path: tests-lane.txt
          retention-days: 1

      # Point the Vulkan loader at lavapipe. The ICD file name differs between Mesa packagings
      # (lvp_icd.json, lvp_icd.x86_64.json), so look it up rather than hard-code it. A missing
      # lavapipe must fail the job: without it every GPU suite skips and the pipelines fall back
      # to the CPU, silently.
      - name: Locate lavapipe and verify it enumerates
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n1 || true)
          if [ -z "$icd" ]; then
            echo "::error::no lavapipe ICD (lvp_icd*.json) under /usr/share/vulkan/icd.d"
            ls -l /usr/share/vulkan/icd.d || true
            exit 1
          fi
          echo "lavapipe ICD: $icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$icd" VK_ICD_FILENAMES="$icd" vulkaninfo --summary | tee vulkaninfo.txt | head -40
          if ! grep -qi 'llvmpipe' vulkaninfo.txt; then
            echo "::error::vulkaninfo does not list a llvmpipe device; GPU suites would silently skip"
            exit 1
          fi

      - name: Test (GPU suites on Mesa lavapipe)
        run: |
          mapfile -t args < ctest-args.txt
          # --repeat until-pass:2: a few tests assert wall-clock bounds that a busy shared runner can miss.
          ctest --test-dir build --parallel 4 --timeout 3600 --repeat until-pass:2 "${args[@]}" 2>&1 | tee ctest.log
          exit "${PIPESTATUS[0]}"

      - name: Skip summary
        if: always()
        run: |
          log=build/Testing/Temporary/LastTest.log
          sed -nE 's/^\[  SKIPPED \] ([A-Za-z0-9_\/.]+) \(.*$/\1/p' "$log" | sort -u > skipped.txt || true
          echo "gtest skips in this lane: $(wc -l < skipped.txt)"
          head -40 skipped.txt
          grep -c 'vkCreateInstance failed' "$log" || true

  macos-test:
    name: macOS test ${{ matrix.lane }}
    needs: [plan, macos]
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.macos) }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install runtime dependencies
        run: |
          brew install eigen ceres-solver proj libtiff libpng jpeg-turbo pybind11 libomp molten-vk \
            vulkan-loader vulkan-headers vulkan-tools vulkan-validationlayers

      - name: Install Qt 6.8 (GUI)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125  # v4.4.1
        env:
          # Distro pythons are "externally managed"; aqtinstall must be allowed to install.
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        with:
          version: "6.8.3"
          # qtshadertools provides qsb and qt_add_shaders(), which compile the viewport's
          # GLSL to the .qsb files every QRhi backend loads.
          modules: "qtshadertools"
          cache: true
          setup-python: false

      - uses: actions/download-artifact@v8
        with:
          name: build-macos

      - name: Unpack build tree
        run: tar --zstd -xf build.tar.zst

      - name: Select tests
        env:
          FLAG: ${{ matrix.flag }}
          REGEX: ${{ matrix.regex }}
          INDEX: ${{ matrix.index }}
          TOTAL: ${{ matrix.total }}
        run: |
          args=("$FLAG" "$REGEX")
          if [ "$INDEX" != 0 ]; then args+=(-I "$INDEX,,$TOTAL"); fi
          printf '%s\n' "${args[@]}" > ctest-args.txt
          ctest --test-dir build -N "${args[@]}" | sed -nE 's/^ +Test +#[0-9]+: (.*)$/\1/p' > tests-lane.txt
          echo "tests in this lane: $(wc -l < tests-lane.txt)"

      - uses: actions/upload-artifact@v7
        with:
          name: tests-macos-${{ matrix.lane }}
          path: tests-lane.txt
          retention-days: 1

      - name: Test (GPU suites on the runner's Apple paravirtual GPU via MoltenVK)
        run: |
          vulkaninfo --summary | head -20 || true
          args=()
          while IFS= read -r line; do args+=("$line"); done < ctest-args.txt
          # --repeat until-pass:2 absorbs MoltenVK "device lost" flakes on the paravirtual GPU.
          ctest --test-dir build --parallel 3 --timeout 3600 --repeat until-pass:2 "${args[@]}"

  windows-test:
    name: Windows test ${{ matrix.lane }}
    needs: [plan, windows]
    runs-on: windows-2022
    timeout-minutes: 60
    continue-on-error: ${{ !inputs.windows-required }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.windows) }}
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-bincache
      # pybind11 and its python3 port are absent on purpose: that port ships a
      # vcpkg-cmake-wrapper which forces its own Python headers and libraries
      # into find_package(Python3) whenever Development.Module is requested, so
      # the .pyd could only ever be built for vcpkg's interpreter. The packaging
      # step installs pybind11's headers into the setup-python interpreter
      # instead (`pip install pybind11`), which is the one the installer is
      # supposed to carry a module for.
      #
      # vulkan-loader is here and *only* here: the shard needs a real
      # vulkan-1.dll to talk to the lavapipe ICD installed below, while the
      # installer must not ship one (the build job's list omits it, and
      # windows-package asserts bin\vulkan-1.dll is absent from the payload).
      VCPKG_PACKAGES: eigen3 ceres[eigensparse] proj[core,tiff] libjpeg-turbo libpng tiff gtest zlib vulkan-loader
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # The build job saved this cache under the same key; restore only, never save from a shard.
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v6
        with:
          path: .vcpkg-bincache
          key: vcpkg-x64-windows-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: vcpkg-x64-windows-

      - name: Install runtime dependencies (vcpkg, from binary cache)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows `
            $env:VCPKG_PACKAGES.Split(' ')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # A hosted Windows runner has no Vulkan runtime and no Vulkan driver, so
      # the GPU suites would all skip. Linux runs them on llvmpipe; this is the
      # same thing for Windows: Mesa's lavapipe (VK_PHYSICAL_DEVICE_TYPE_CPU),
      # which the tests recognise as a software device and therefore run the
      # correctness assertions against while skipping the speed-up ones.
      #
      # pal1000/mesa-dist-win is the de-facto prebuilt Mesa for Windows. The
      # DLL is Mesa under the MIT licence (see engine/LIMITATIONS.md); it is a
      # test-only dependency and appears in no installer. The archive is pinned
      # by URL and its SHA-256 is checked, so an upstream re-upload cannot
      # change what CI executes.
      - name: Install a software Vulkan driver (Mesa lavapipe)
        shell: pwsh
        run: |
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) {
            foreach ($candidate in 'C:\Program Files\7-Zip\7z.exe',
                                   'C:\Program Files (x86)\7-Zip\7z.exe') {
              if (Test-Path -LiteralPath $candidate) { $sevenZip = $candidate; break }
            }
          }
          if (-not $sevenZip) { throw '7z.exe not found on the runner image' }

          $url = 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z'
          $expected = '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695'
          $archive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          # Invoke-WebRequest is a cmdlet, not a native program: it sets no
          # $LASTEXITCODE. A fresh pwsh session leaves that variable $null, and
          # `$null -ne 0` is true, so a LASTEXITCODE test here fired on a
          # download that had in fact succeeded. The $ErrorActionPreference
          # 'Stop' below turns a failed download into a terminating error, and
          # the size floor catches a truncated body. Mesa 26.2.4's archive is
          # 70,257,286 bytes; the SHA-256 is the real check, this only keeps a
          # half-written file from reaching it.
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          if (-not (Test-Path -LiteralPath $archive) -or
              (Get-Item -LiteralPath $archive).Length -lt 60MB) {
            throw 'the Mesa archive did not download'
          }
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Mesa archive SHA-256 is $actual, expected $expected; refusing to use it"
          }

          # The ICD manifest names '.\vulkan_lvp.dll', i.e. a path relative to
          # the *process working directory*, not to the manifest. The CLI runs
          # from the repository root, so the loader would look for
          # vulkan_lvp.dll there, fail to open it, and answer
          # VK_ERROR_INCOMPATIBLE_DRIVER -- which reads exactly like "this
          # machine has no driver", hiding the real cause. The manifest is
          # rewritten with an absolute path instead.
          $dest = Join-Path $env:RUNNER_TEMP 'mesa'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          & $sevenZip e $archive 'x64/vulkan_lvp.dll' 'x64/lvp_icd.x86_64.json' "-o$dest" -y
          if ($LASTEXITCODE -ne 0) { throw 'extracting lavapipe from the Mesa archive failed' }
          foreach ($file in 'vulkan_lvp.dll', 'lvp_icd.x86_64.json') {
            if (-not (Test-Path -LiteralPath (Join-Path $dest $file))) {
              throw "$file did not come out of the Mesa archive"
            }
          }

          $manifest = Join-Path $dest 'lvp_icd.x86_64.json'
          $icd = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          # ConvertTo-Json escapes backslashes itself, so the path goes in
          # exactly as the filesystem spells it. (Pre-escaping here would write
          # "D:\\\\a\\\\..." and the loader would look for a directory that does
          # not exist.)
          $icd.ICD.library_path = Join-Path $dest 'vulkan_lvp.dll'
          $icd | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $manifest -Encoding utf8
          Get-Content -LiteralPath $manifest | Write-Host

          # VK_DRIVER_FILES pins the loader to this driver: without it the
          # loader would scan the registry and find nothing, because the runner
          # has no GPU driver installed at all.
          "VK_DRIVER_FILES=$manifest" >> $env:GITHUB_ENV
          # VK_ICD_FILENAMES is the older spelling. Mesa's own docs and the
          # Linux lane set both; a loader reads either.
          "VK_ICD_FILENAMES=$manifest" >> $env:GITHUB_ENV
          "ALPHASHAPE_MESA_DIR=$dest" >> $env:GITHUB_ENV

      # Pin the interpreter: CMake bakes its absolute path into the rng_order_check test, and the
      # test shards must find the same one (image Python patch versions differ between runners).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Qt 6.8 (GUI)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125  # v4.4.1
        env:
          # Distro pythons are "externally managed"; aqtinstall must be allowed to install.
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          modules: "qtshadertools"
          cache: true
          setup-python: false

      - uses: actions/download-artifact@v8
        with:
          name: build-windows

      - name: Unpack build tree
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\tar.exe" -xzf build.tar.gz
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Proves the loader/driver wiring before the whole suite depends on it:
      # without this, a broken ICD path shows up as every GPU test skipping, and
      # a skipped test is green.
      - name: GPU device is visible
        shell: pwsh
        run: |
          $env:PATH = "$env:ALPHASHAPE_MESA_DIR;$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin;$env:PATH"
          $cli = "build\src\apps\cli\alphashape-cli.exe"
          if (-not (Test-Path -LiteralPath $cli)) { throw "$cli is not in the build tree" }
          $output = & $cli --gpu-info 2>&1
          $output | Write-Host
          if ($LASTEXITCODE -ne 0) {
            # The loader's own diagnostics are the only thing that says *why* it
            # rejected the ICD; the CLI's reason cannot tell "no driver" from
            # "the manifest pointed at a path that does not exist".
            Write-Host "--- VK_DRIVER_FILES: $env:VK_DRIVER_FILES"
            Get-Content -LiteralPath $env:VK_DRIVER_FILES -ErrorAction SilentlyContinue | Write-Host
            $icdDir = $env:ALPHASHAPE_MESA_DIR
            Get-ChildItem -LiteralPath $icdDir -ErrorAction SilentlyContinue |
              Select-Object Name, Length | Format-Table | Out-Host
            # A second run with the loader's debug output on, which the normal
            # path keeps quiet.
            $env:VK_LOADER_DEBUG = 'all'
            & $cli --gpu-info 2>&1 | Select-Object -Last 40 | Write-Host
            throw "alphashape-cli --gpu-info exited $LASTEXITCODE"
          }
          $text = ($output -join "`n")
          if ($text -notmatch 'gpu device 0:') { throw 'no Vulkan device was enumerated' }
          # lavapipe identifies itself as a software device, which is what the
          # correctness tests key on; if it came back as hardware the timing
          # assertions would run against a CPU and could fail for the wrong
          # reason.
          if ($text -notmatch 'software') { throw "expected a software device, got: $text" }

      - name: Select tests
        shell: pwsh
        env:
          FLAG: ${{ matrix.flag }}
          REGEX: ${{ matrix.regex }}
          INDEX: ${{ matrix.index }}
          TOTAL: ${{ matrix.total }}
        run: |
          $env:PATH = "C:\Program Files\LLVM\bin;$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin;$env:PATH"
          $ctestArgs = @($env:FLAG, $env:REGEX)
          if ($env:INDEX -ne '0') { $ctestArgs += '-I'; $ctestArgs += "$($env:INDEX),,$($env:TOTAL)" }
          $ctestArgs | Set-Content -Encoding ascii ctest-args.txt
          ctest --test-dir build -N @ctestArgs | ForEach-Object { if ($_ -match '^\s+Test\s+#\d+: (.*)$') { $Matches[1] } } | Set-Content -Encoding ascii tests-lane.txt
          "tests in this lane: $((Get-Content tests-lane.txt).Count)"

      - uses: actions/upload-artifact@v7
        with:
          name: tests-windows-${{ matrix.lane }}
          path: tests-lane.txt
          retention-days: 1

      - name: Test
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\LLVM\bin;$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin;$env:PATH"
          # vcpkg installs proj.db under share/proj; nothing on Windows points PROJ at it.
          $env:ALPHASHAPE_PROJ_DATA = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\share\proj"
          $ctestArgs = Get-Content ctest-args.txt
          # --repeat until-pass:2: a few tests assert wall-clock bounds that a busy shared runner can miss.
          ctest --test-dir build --parallel 4 --timeout 3600 --repeat until-pass:2 @ctestArgs

  # The lanes must together run every test exactly once; fails if a lane was dropped or overlaps.
  shard-coverage:
    name: Test shard coverage
    needs: [linux-test, macos-test, windows-test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tests-*
          path: lists

      - name: Compare lanes with the full test list
        env:
          FULL: ${{ inputs.full }}
        run: |
          status=0
          for os in linux macos windows; do
            [ -f "lists/tests-$os-all/tests-all.txt" ] || { echo "$os: no build, skipping"; continue; }
            cat lists/tests-$os-[!a]*/tests-lane.txt 2>/dev/null | tr -d '\r' | sort > "$os.lanes"
            tr -d '\r' < "lists/tests-$os-all/tests-all.txt" | sort > "$os.all"
            echo "$os: $(wc -l < "$os.all") tests, $(wc -l < "$os.lanes") run across $(compgen -G "lists/tests-$os-[!a]*" | wc -l) lanes"
            if [ -d "lists/tests-$os-all" ] && ! compgen -G "lists/tests-$os-[!a]*" >/dev/null; then
              echo "$os: build succeeded but no test lanes reported"; status=1; continue
            fi
            if [ "$os" = macos ] || [ "$FULL" = true ]; then
              diff "$os.all" "$os.lanes" || { echo "::error::$os lanes differ from the full test list"; status=1; }
            else
              # Pull request: heavy lanes are skipped, so lanes must be a duplicate-free subset.
              [ -z "$(uniq -d "$os.lanes")" ] || { echo "::error::$os: a test is in two lanes"; status=1; }
              missing=$(comm -13 "$os.all" "$os.lanes")
              [ -z "$missing" ] || { echo "::error::$os: lanes run unknown tests: $missing"; status=1; }
            fi
          done
          exit $status
