# GitLab runs only the NVIDIA GPU lane. The code lives on GitHub; this project is a
# pull mirror (gitlab.com/alphashape/alphashape) and pipeline results are posted back
# to the GitHub commit / pull request as status checks.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "pull_mirror_update"
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"

stages: [probe]

# Spike: does Vulkan see the T4 inside the runner's container? Our GPU layer is
# Vulkan compute, which needs the NVIDIA "graphics" driver capability and an ICD
# manifest, not just CUDA.
.probe: &probe
  stage: probe
  tags: [saas-linux-medium-amd64-gpu-standard]
  timeout: 20m
  variables:
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: all
    DEBIAN_FRONTEND: noninteractive
  script:
    - env | grep -i nvidia || true
    - nvidia-smi || echo "nvidia-smi not available"
    - ls /dev | grep -i nvidia || echo "no /dev/nvidia* devices"
    - ls /usr/lib/x86_64-linux-gnu | grep -iE "nvidia|GLX|libcuda" || echo "no NVIDIA user-space libraries mounted"
    - ls /usr/share/vulkan/icd.d /etc/vulkan/icd.d 2>/dev/null || true
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends vulkan-tools libvulkan1 >/dev/null
    - |
      if [ ! -e /usr/share/vulkan/icd.d/nvidia_icd.json ] && [ ! -e /etc/vulkan/icd.d/nvidia_icd.json ]; then
        mkdir -p /etc/vulkan/icd.d
        printf '{"file_format_version":"1.0.0","ICD":{"library_path":"libGLX_nvidia.so.0","api_version":"1.3"}}\n' > /etc/vulkan/icd.d/nvidia_icd.json
      fi
    - vulkaninfo --summary 2>&1 | grep -iE "deviceName|deviceType|driverName|apiVersion" || true
    - vulkaninfo --summary 2>/dev/null | grep -iE "deviceName.*(Tesla|T4|NVIDIA)"

# Images differ in what the NVIDIA container runtime injects: CUDA base images
# declare NVIDIA_* in their own env; the Vulkan image ships the ICD manifest.
probe-cuda-base:
  <<: *probe
  image: nvidia/cuda:12.6.3-base-ubuntu24.04

probe-nvidia-vulkan:
  <<: *probe
  image: nvidia/vulkan:1.3-470
  before_script:
    - rm -f /etc/apt/sources.list.d/cuda*.list || true
