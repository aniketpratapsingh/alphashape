# GitLab runs only the NVIDIA GPU lane. The code lives on GitHub; this project is a
# pull mirror (gitlab.com/alphashape/alphashape) and pipeline results are posted back
# to the GitHub commit / pull request as status checks.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "pull_mirror_update"
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"

stages: [probe]

# Spike: does Vulkan see the T4 inside the runner's container? Our GPU layer is
# Vulkan compute, which needs the NVIDIA "graphics" driver capability and an ICD
# manifest, not just CUDA.
.probe: &probe
  stage: probe
  tags: [saas-linux-medium-amd64-gpu-standard]
  timeout: 20m
  variables:
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: all
    DEBIAN_FRONTEND: noninteractive
  script:
    - env | grep -i nvidia || true
    - nvidia-smi || echo "nvidia-smi not available"
    - ls /dev | grep -i nvidia || echo "no /dev/nvidia* devices"
    - ls /usr/lib/x86_64-linux-gnu | grep -iE "nvidia|GLX|libcuda" || echo "no NVIDIA user-space libraries mounted"
    - ls /usr/share/vulkan/icd.d /etc/vulkan/icd.d 2>/dev/null || true
    - ls -la /usr/local/nvidia /usr/local/nvidia/lib64 2>&1 | head -120
    - find /usr/local/nvidia -name "*icd*.json" -o -name "*vulkan*" 2>/dev/null
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends vulkan-tools libvulkan1 libxext6 libx11-6 libegl1 >/dev/null
    - |
      if [ ! -e /usr/share/vulkan/icd.d/nvidia_icd.json ] && [ ! -e /etc/vulkan/icd.d/nvidia_icd.json ]; then
        mkdir -p /etc/vulkan/icd.d
        lib=$(ls /usr/local/nvidia/lib64/libGLX_nvidia.so.0 2>/dev/null || echo libGLX_nvidia.so.0)
        printf '{"file_format_version":"1.0.0","ICD":{"library_path":"%s","api_version":"1.3"}}\n' "$lib" > /etc/vulkan/icd.d/nvidia_icd.json
        cat /etc/vulkan/icd.d/nvidia_icd.json
      fi
    - for l in libGLX_nvidia.so.0 libEGL_nvidia.so.0 libnvidia-glcore.so.535.161.07 libnvidia-glvkspirv.so.535.161.07; do echo "== $l"; ldd /usr/local/nvidia/lib64/$l | grep -i "not found" || echo "deps ok"; done
    - ls /dev/dri 2>&1 || true; ls -l /dev/nvidia* || true
    - LD_DEBUG=libs vulkaninfo --summary 2>&1 | grep -iE "nvidia.*(cannot|error|not found)|cannot open|calling init:.*nvidia" | sort -u | head -40 || true
    - VK_LOADER_DEBUG=error,warn,driver vulkaninfo --summary 2>&1 | tail -15 || true
    - echo "== try the EGL ICD"; printf '{"file_format_version":"1.0.0","ICD":{"library_path":"/usr/local/nvidia/lib64/libEGL_nvidia.so.0","api_version":"1.3"}}\n' > /etc/vulkan/icd.d/nvidia_icd.json
    - VK_LOADER_DEBUG=error,warn vulkaninfo --summary 2>&1 | grep -iE "deviceName|deviceType|ERROR" | head -15 || true
    - vulkaninfo --summary 2>/dev/null | grep -iE "deviceName.*(Tesla|T4|NVIDIA)"

# The runner mounts the driver (incl. libGLX_nvidia, the Vulkan ICD) under
# /usr/local/nvidia but ships no ICD manifest; libGLX_nvidia needs libX11/libXext.
probe-cuda-base:
  <<: *probe
  image: nvidia/cuda:12.6.3-base-ubuntu24.04
